name: Feature request
description: Suggest something Serpent's Eyes should do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the goal rather than the solution — it often has a simpler answer.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part?
      options:
        - The app (viewer)
        - The Core library
        - The extractor / game data
        - Not sure
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Anything you have tried or considered
    validations:
      required: false
