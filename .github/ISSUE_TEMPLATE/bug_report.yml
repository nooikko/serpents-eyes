name: Bug report
description: Something is broken, or a save file does not load correctly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report.

        **Please do not attach a save file you consider private.** A save contains your
        progression, current map and position, and loadout. If one is needed we will ask.

  - type: input
    id: version
    attributes:
      label: Serpent's Eyes version
      description: Shown on the Releases page, or the commit you built from.
      placeholder: "v0.1.0"
    validations:
      required: true

  - type: input
    id: game-version
    attributes:
      label: Serpent's Gaze version or build
      description: Relevant for anything involving save files or missing content.
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Linux (Proton)
        - macOS
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the exact error text if there is one.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: false

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Switch to the autosave profile
        3. ...
    validations:
      required: true

  - type: textarea
    id: crash-log
    attributes:
      label: Crash log
      description: >
        If the app closed unexpectedly, paste the tail of
        %LOCALAPPDATA%\SerpentsEyes\crash.log. It is rendered as code, so no backticks needed.
      render: text
    validations:
      required: false
